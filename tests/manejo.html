// ---------------------------------------------------------------- pista simulada (API Surface)
// Rectángulo redondeado de ~635 m, ancho 12 m, pianos en las curvas, pasto y muros a 11.5 m del centro.
class FakeTrack {
  constructor() {
    this.closed = true;
    this.halfWidth = 6; this.wall = 11.5;
    const segs = [];
    const S = len => segs.push({ kind: 'S', len }), A = r => segs.push({ kind: 'A', r, len: r * Math.PI / 2 });
    S(101); A(35); S(55); A(20); S(175); A(35); S(61); A(14); S(80);
    let x = 0, z = 0, hx = 0, hz = -1, d = 0;
    for (const s of segs) {
      s.d0 = d; s.x0 = x; s.z0 = z; s.hx = hx; s.hz = hz;
      if (s.kind === 'S') { x += hx * s.len; z += hz * s.len; }
      else {
        const rx = -hz, rz = hx;
        s.cx = x + rx * s.r; s.cz = z + rz * s.r;
        x = s.cx + hx * s.r; z = s.cz + hz * s.r; hx = rx; hz = rz;
      }
      d += s.len;
    }
    this.segs = segs; this.length = d; this.finishDistance = d; this.pitZone = null; this.props = [];
    this.N = Math.ceil(d);
    this.ds = d / this.N;
    this.X = new Float64Array(this.N); this.Z = new Float64Array(this.N);
    const tmp = {};
    for (let i = 0; i < this.N; i++) { this._eval(i * this.ds, tmp); this.X[i] = tmp.x; this.Z[i] = tmp.z; }
    this.minimap = [];
    for (let i = 0; i < this.N; i += 4) this.minimap.push([this.X[i], this.Z[i]]);
  }
  _wrap(d) { const L = this.length; return ((d % L) + L) % L; }
  _eval(d, o) {
    d = this._wrap(d);
    let s = this.segs[this.segs.length - 1];
    for (const g of this.segs) if (d < g.d0 + g.len) { s = g; break; }
    const t = d - s.d0;
    if (s.kind === 'S') { o.x = s.x0 + s.hx * t; o.z = s.z0 + s.hz * t; o.tx = s.hx; o.tz = s.hz; o.k = 0; }
    else {
      const th = t / s.r, c = Math.cos(th), sn = Math.sin(th);
      const rx = -s.hz, rz = s.hx;
      o.tx = s.hx * c + rx * sn; o.tz = s.hz * c + rz * sn;
      const Rx = rx * c - s.hx * sn, Rz = rz * c - s.hz * sn;
      o.x = s.cx - Rx * s.r; o.z = s.cz - Rz * s.r; o.k = 1 / s.r;
    }
    o.d = d;
    return o;
  }
  sampleAt(dist) {
    const o = this._eval(dist, {});
    return { pos: new THREE.Vector3(o.x, 0, o.z), tangent: new THREE.Vector3(o.tx, 0, o.tz), right: new THREE.Vector3(-o.tz, 0, o.tx),
             normal: new THREE.Vector3(0, 1, 0), halfWidth: this.halfWidth, curvature: o.k, height: 0, banking: 0 };
  }
  query(pos, hint) {
    const N = this.N, X = this.X, Z = this.Z;
    let best = 0, bd = Infinity;
    if (hint != null && hint >= 0) {
      for (let j = -40; j <= 40; j++) { const i = ((hint + j) % N + N) % N; const dx = pos.x - X[i], dz = pos.z - Z[i], q = dx * dx + dz * dz; if (q < bd) { bd = q; best = i; } }
    } else {
      for (let i = 0; i < N; i++) { const dx = pos.x - X[i], dz = pos.z - Z[i], q = dx * dx + dz * dz; if (q < bd) { bd = q; best = i; } }
    }
    const o = {};
    let d = best * this.ds;
    for (let it = 0; it < 2; it++) { this._eval(d, o); d = d + (pos.x - o.x) * o.tx + (pos.z - o.z) * o.tz; }
    this._eval(d, o);
    const lateral = (pos.x - o.x) * -o.tz + (pos.z - o.z) * o.tx;
    const al = Math.abs(lateral);
    let surface = 'asfalto', grip = 1, drag = 0;
    if (al > this.halfWidth + 1 || (al > this.halfWidth && o.k === 0)) { surface = 'pasto'; grip = 0.6; drag = 0.25; }
    else if (al > this.halfWidth) { surface = 'piano'; grip = 0.95; drag = 0.02; }
    return { index: Math.round(o.d / this.ds) % N, distance: o.d, lateral, halfWidth: this.halfWidth,
      leftWall: this.wall, rightWall: this.wall, height: 0, normal: new THREE.Vector3(0, 1, 0),
      tangent: new THREE.Vector3(o.tx, 0, o.tz), right: new THREE.Vector3(-o.tz, 0, o.tx),
      surface, grip, drag, inPit: false, offTrack: al > this.halfWidth + 0.5 };
  }
  gridSlots(n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const s = this.sampleAt(-10 - i * 7);
      const p = s.pos.clone().addScaledVector(s.right, i % 2 ? 2.6 : -2.6);
      out.push({ pos: p, yaw: Math.atan2(-s.tangent.x, -s.tangent.z) });
    }
    return out;
  }
}

// ---------------------------------------------------------------- escena
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

const track = new FakeTrack();
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshLambertMaterial({ color: 0x4f8a3a }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(115, -0.02, -55); scene.add(ground);
  // ribbons: asfalto, pianos, muros
  const ribbon = (l0, l1, y0, y1, colorFn, step = 2, vertical = false) => {
    const pos = [], col = [], idx = []; let n = 0;
    for (let d = 0; d <= track.length + 0.01; d += step) {
      const s = track.sampleAt(d), c = new THREE.Color(colorFn(d));
      const a = s.pos.clone().addScaledVector(s.right, l0), b = s.pos.clone().addScaledVector(s.right, l1);
      pos.push(a.x, y0, a.z, b.x, vertical ? y1 : y0, vertical ? b.z : b.z);
      if (vertical) { pos[pos.length - 3] = a.x; pos[pos.length - 1] = a.z; }
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);
      if (n > 0) { const k = n * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k); }
      n++;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  };
  scene.add(ribbon(-6, 6, 0.01, 0.01, d => (Math.floor(d / 4) % 2 ? 0x55585e : 0x5c5f66)));
  const onArc = d => track._eval(d, {}).k > 0;
  const kerb = d => onArc(d) ? (Math.floor(d / 2) % 2 ? 0xd02020 : 0xf2f2f2) : 0x4f8a3a;
  scene.add(ribbon(6, 7, 0.02, 0.02, kerb, 1)); scene.add(ribbon(-7, -6, 0.02, 0.02, kerb, 1));
  const wallC = d => (Math.floor(d / 5) % 2 ? 0xbfc4cc : 0xe04040);
  scene.add(ribbon(track.wall, track.wall, 0, 1.0, wallC, 2, true));
  scene.add(ribbon(-track.wall, -track.wall, 0, 1.0, wallC, 2, true));
  // línea de meta
  const s0 = track.sampleAt(0);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(12, 1.2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.rotation.x = -Math.PI / 2; line.position.copy(s0.pos).setY(0.03); scene.add(line);
  // conos de referencia cada 25 m y árboles
  const cones = new THREE.InstancedMesh(new THREE.ConeGeometry(0.35, 0.9, 8), new THREE.MeshLambertMaterial({ color: 0xff7a00 }), Math.ceil(track.length / 25) * 2);
  const m = new THREE.Matrix4(); let ci = 0;
  for (let d = 0; d < track.length; d += 25) for (const side of [-8.5, 8.5]) {
    const s = track.sampleAt(d); const p = s.pos.clone().addScaledVector(s.right, side);
    m.makeTranslation(p.x, 0.45, p.z); cones.setMatrixAt(ci++, m);
  }
  scene.add(cones);
  const trees = new THREE.InstancedMesh(new THREE.ConeGeometry(2.2, 7, 6), new THREE.MeshLambertMaterial({ color: 0x2e6b2a, flatShading: true }), 160);
  let r = 12345; const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 160; i++) {
    const s = track.sampleAt(rnd() * track.length); const side = (rnd() < 0.5 ? -1 : 1) * (16 + rnd() * 40);
    const p = s.pos.clone().addScaledVector(s.right, side);
    const q = track.query(p);
    if (Math.abs(q.lateral) < 15) { m.makeTranslation(0, -50, 0); trees.setMatrixAt(i, m); continue; }
    m.makeTranslation(p.x, 3.5, p.z); trees.setMatrixAt(i, m);
  }
  scene.add(trees);
}

// ---------------------------------------------------------------- auto caja (modelo simulado)
function makeCar(color, spec) {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color });
  const dark = new THREE.MeshLambertMaterial({ color: 0x22252c });
  const wb = spec.wheelbase, r = spec.wheelRadius, tw = spec.trackWidth;
  const len = wb + 1.7;
  const body = new THREE.Mesh(new THREE.BoxGeometry(tw + 0.3, 0.5, len), mat); body.position.y = r + 0.25; group.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(tw, 0.45, len * 0.45), dark); cabin.position.set(0, r + 0.72, 0.2); group.add(cabin);
  const dash = new THREE.Mesh(new THREE.BoxGeometry(tw, 0.12, 0.35), new THREE.MeshLambertMaterial({ color: 0x111317 }));
  dash.position.set(0, r + 0.62, -0.55); group.add(dash);
  const wgeo = new THREE.CylinderGeometry(r, r, 0.26, 12); wgeo.rotateZ(Math.PI / 2);
  const wmat = new THREE.MeshLambertMaterial({ color: 0x15161a });
  const rim = new THREE.BoxGeometry(0.27, r * 1.3, 0.12);
  const wheels = [];
  for (const [front, side] of [[true, 'L'], [true, 'R'], [false, 'L'], [false, 'R']]) {
    const pivot = new THREE.Group();
    pivot.position.set((side === 'L' ? -1 : 1) * tw / 2, r, front ? -wb / 2 : wb / 2);
    const mesh = new THREE.Mesh(wgeo, wmat); mesh.add(new THREE.Mesh(rim, new THREE.MeshLambertMaterial({ color: 0xbbbbbb })));
    pivot.add(mesh); group.add(pivot);
    wheels.push({ mesh, pivot, front, side, radius: r, worldPos: () => mesh.getWorldPosition(new THREE.Vector3()) });
  }
  const lightMat = new THREE.MeshBasicMaterial({ color: 0x550000 });
  for (const x of [-0.6, 0.6]) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.05), lightMat); l.position.set(x, r + 0.35, len / 2 + 0.01); group.add(l); }
  const eye = new THREE.Object3D(); eye.position.set(-0.36, r + 0.83, 0.15); group.add(eye);
  const hood = new THREE.Object3D(); hood.position.set(0, r + 0.62, -0.95); group.add(hood);
  const steeringWheel = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.025, 6, 16), dark);
  steeringWheel.position.set(-0.36, r + 0.7, -0.3); steeringWheel.rotation.x = -0.4; group.add(steeringWheel);
  let spin = 0;
  return {
    group, wheels, cockpit: { eye, steeringWheel }, hood,
    update(dt, st) {
      spin += (st.speed || 0) / r * dt;
      for (const w of wheels) { w.mesh.rotation.x = -spin; if (w.front) w.pivot.rotation.y = -(st.steerAngle || 0); }
      steeringWheel.rotation.z = -(st.steerAngle || 0) * 8;
      lightMat.color.setHex(st.gear === -1 ? 0xeeeeee : (st.brake > 0.1 ? 0xff2020 : 0x550000));
    },
    setOpacity() {}, setLights() {}, setDamage() {}, setNameTag() {}, dispose() {},
  };
}

// ---------------------------------------------------------------- autos
const input = new Input(window);
const rig = new CameraRig(renderer, { fov: 70 });
rig.mirror = true;
const cars = [];
function addCar(presetKey, slot, isBot, seed = 1, lateralOffset = 0) {
  const P = PRESETS[presetKey];
  const physics = new VehiclePhysics(P.spec);
  physics.reset(slot.pos, slot.yaw);
  const model = makeCar(P.color, P.spec);
  scene.add(model.group);
  const car = { presetKey, physics, model, surface: null, isBot, lap: 0, lapStart: null, lastLap: null, bestLap: null, lastDist: null, resets: 0, maxLat: 0, hits: 0 };
  if (isBot) car.ai = new AIDriver(track, physics, { skill: 'normal', seed, lateralOffset });
  cars.push(car);
  return car;
}
let player = null, presetKey = 'jdm', gearbox = 'auto';
function spawnPlayer(key) {
  presetKey = key;
  const slot = track.gridSlots(1)[0];
  if (player) { scene.remove(player.model.group); cars.splice(cars.indexOf(player), 1); }
  player = addCar(key, slot, false);
  player.physics.gearbox = gearbox;
  rig.setTarget({ model: player.model, physics: player.physics });
  stats.reset();
  refreshBar();
}
function addBots() {
  const slots = track.gridSlots(8);
  const keys = Object.keys(PRESETS);
  for (let i = 0; i < 3; i++) {
    const n = cars.filter(c => c.isBot).length;
    const slot = slots[1 + (n % 7)];
    addCar(keys[(n + 1) % keys.length], slot, true, n * 977 + 13, ((n % 3) - 1) * 1.5);
  }
}
function respawn(car) {
  const s = track.sampleAt(car.surface ? car.surface.distance : 0);
  car.physics.reset(s.pos, Math.atan2(-s.tangent.x, -s.tangent.z));
  car.surface = track.query(car.physics.position);
  car.resets++;
  if (car.ai) car.ai.reset();
}

// ---------------------------------------------------------------- estadísticas del jugador
const stats = {
  reset() { this.t0 = null; this.t100 = null; this.vmax = 0; this.braking = null; },
  update(p, dt, now) {
    const kmh = p.speed * 3.6;
    this.vmax = Math.max(this.vmax, kmh);
    if (kmh < 1 && p.throttle > 0.5) this.t0 = now;
    if (this.t0 != null && this.t100 == null && kmh >= 100) this.t100 = now - this.t0;
  },
};

// ---------------------------------------------------------------- piloto automático con teclado simulado
// Usa un AIDriver como «cerebro» pero solo puede apretar teclas (eventos KeyboardEvent reales).
function makeKeyPilot(target, physics) {
  const brain = new AIDriver(track, physics, { skill: 'normal', seed: 4242 });
  const held = new Set();
  const set = (code, on) => {
    if (on && !held.has(code)) { held.add(code); target.dispatchEvent(new KeyboardEvent('keydown', { code, key: code, bubbles: true })); }
    if (!on && held.has(code)) { held.delete(code); target.dispatchEvent(new KeyboardEvent('keyup', { code, key: code, bubbles: true })); }
  };
  // Como una persona: da toquecitos (modulación por ancho de pulso) en ciclos de ~0.12 s.
  let ph = 0;
  return {
    brain,
    tick(dt, surface) {
      const c = brain.controls(dt, surface, []);
      ph = (ph + dt / 0.12) % 1;
      const st = Math.min(1, Math.abs(c.steer) * 1.3);
      const sOn = st > 0.08 && ph < st;
      set('KeyD', sOn && c.steer > 0); set('KeyA', sOn && c.steer < 0);
      set('KeyW', c.throttle > 0.9 || ph < c.throttle); set('KeyS', c.brake > 0.15 && (c.brake > 0.7 || ph < c.brake + 0.2));
    },
    release() { for (const k of [...held]) set(k, false); },
  };
}
let keyPilot = null;

// ---------------------------------------------------------------- pruebas automáticas (sin dibujar)
function flatSurface(p) {
  return { index: 0, distance: 0, lateral: p.position.x, halfWidth: 1e4, leftWall: Infinity, rightWall: Infinity, height: 0,
    normal: { x: 0, y: 1, z: 0 }, tangent: { x: 0, y: 0, z: -1 }, right: { x: 1, y: 0, z: 0 }, surface: 'asfalto', grip: 1, drag: 0 };
}
function testAccel(key) {
  const p = new VehiclePhysics(PRESETS[key].spec); p.reset({ x: 0, y: 0, z: 0 }, 0);
  const dt = 1 / 60; let t = 0, t100 = null, t200 = null, vmax = 0, q = null;
  while (t < 70) {
    p.step(dt, { throttle: 1, brake: 0, steer: 0 }, flatSurface(p)); t += dt;
    const k = p.speed * 3.6; vmax = Math.max(vmax, k);
    if (t100 == null && k >= 100) t100 = t; if (t200 == null && k >= 200) t200 = t; if (q == null && -p.position.z >= 402) q = t;
  }
  p.reset({ x: 0, y: 0, z: 0 }, 0); t = 0;
  while (p.speed * 3.6 < 100 && t < 30) { p.step(dt, { throttle: 1, brake: 0, steer: 0 }, flatSurface(p)); t += dt; }
  const z0 = p.position.z;
  while (p.speed > 0.1) p.step(dt, { throttle: 0, brake: 1, steer: 0 }, flatSurface(p));
  return { t100: +(t100 || 0).toFixed(2), t200: t200 ? +t200.toFixed(2) : null, cuarto: +(q || 0).toFixed(2), vmax: Math.round(vmax), freno100: +Math.abs(p.position.z - z0).toFixed(1) };
}
// Vueltas con un piloto: 'bot' (AIDriver directo) o 'teclado' (Input + teclas simuladas).
function testLaps(key, mode = 'bot', laps = 3, nBots = 1) {
  const dt = 1 / 60;
  const slots = track.gridSlots(Math.max(nBots, 1));
  const list = [];
  for (let i = 0; i < Math.max(nBots, 1); i++) {
    const p = new VehiclePhysics(PRESETS[key].spec);
    p.reset(slots[i].pos, slots[i].yaw);
    const e = { p, s: track.query(p.position), laps: [], lapT: null, last: null, t: 0, resets: 0, maxEdge: 0, hits: 0, vmax: 0 };
    if (mode === 'teclado' && i === 0) {
      e.target = new EventTarget(); e.input = new Input(e.target); e.pilot = makeKeyPilot(e.target, p);
      p.gearbox = 'auto';
    } else e.ai = new AIDriver(track, p, { seed: 100 + i * 31, lateralOffset: ((i % 3) - 1) * 1.5 });
    list.push(e);
  }
  for (let t = 0; t < 400; t += dt) {
    for (const e of list) {
      let c;
      if (e.pilot) { e.pilot.tick(dt, e.s); e.input.update(dt); c = e.input.state; }
      else {
        const others = list.filter(o => o !== e).map(o => ({ position: o.p.position, speed: o.p.speed }));
        c = e.ai.controls(dt, e.s, others);
        if (e.ai.needsReset) { e.ai.needsReset = false; e.resets++; const s = track.sampleAt(e.s.distance); e.p.reset(s.pos, Math.atan2(-s.tangent.x, -s.tangent.z)); e.ai.reset(); }
      }
      e.p.step(dt, c, e.s);
      e.s = track.query(e.p.position, e.s.index);
      const yaw = e.p.yaw, R = e.s.right;
      const ext = e.p._hw * Math.abs(Math.cos(yaw) * R.x - Math.sin(yaw) * R.z) + e.p._hl * Math.abs(-Math.sin(yaw) * R.x - Math.cos(yaw) * R.z);
      e.maxEdge = Math.max(e.maxEdge, Math.abs(e.s.lateral) + ext * 0.98);
      if (e.p.wallHit > 0.25) e.hits++;
      e.vmax = Math.max(e.vmax, e.p.speed * 3.6);
      const d = e.s.distance;
      if (e.last != null && e.last > track.length - 40 && d < 40) { if (e.lapT != null) e.laps.push(+(t - e.lapT).toFixed(2)); e.lapT = t; }
      e.last = d;
    }
    if (list.every(e => e.laps.length >= laps)) break;
  }
  for (const e of list) if (e.pilot) e.pilot.release();
  return list.map(e => ({ vueltas: e.laps, vmax: Math.round(e.vmax), bordeMax: +e.maxEdge.toFixed(2), muro: track.wall, golpes: e.hits, reinicios: e.resets }));
}
// Freno de mano y derrape con potencia: ángulo máximo y si da trompo.
function testSlide(key, kind) {
  const p = new VehiclePhysics(PRESETS[key].spec); p.reset({ x: 0, y: 0, z: 0 }, 0);
  const dt = 1 / 60; let t = 0;
  while (p.speed < (kind === 'mano' ? 70 : 50) / 3.6 && t < 30) { p.step(dt, { throttle: 1, brake: 0, steer: 0 }, flatSurface(p)); t += dt; }
  let maxB = 0, spun = false; t = 0;
  while (t < 3) {
    const c = kind === 'mano' ? { throttle: 0.3, brake: 0, steer: t < 0.8 ? 1 : 0, handbrake: t > 0.1 && t < 0.7 } : { throttle: 1, brake: 0, steer: 1 };
    p.step(dt, c, flatSurface(p)); t += dt;
    maxB = Math.max(maxB, Math.abs(p.slipAngle)); if (Math.abs(p.slipAngle) > 1.3) spun = true;
  }
  return { anguloMax: +(maxB * 57.3).toFixed(1), trompo: spun, kmhFinal: Math.round(p.speed * 3.6) };
}
function runAll() {
  const out = {};
  for (const k of Object.keys(PRESETS)) {
    out[k] = { ...testAccel(k), mano: testSlide(k, 'mano'), potencia: testSlide(k, 'potencia'), bot: testLaps(k, 'bot', 2, 1)[0] };
  }
  out.teclado = testLaps('jdm', 'teclado', 2, 1)[0];
  out.pelotonJDM = testLaps('jdm', 'bot', 2, 4);
  return out;
}
window.T = { PRESETS, track, cars, testAccel, testLaps, testSlide, runAll, get player() { return player; }, rig, input };

// ---------------------------------------------------------------- barra de botones
const bar = document.getElementById('bar'), res = document.getElementById('res');
function button(text, fn, on = false) { const b = document.createElement('button'); b.textContent = text; if (on) b.className = 'on'; b.onclick = e => { e.currentTarget.blur(); fn(); }; bar.appendChild(b); }
function refreshBar() {
  bar.innerHTML = '';
  for (const k of Object.keys(PRESETS)) button(PRESETS[k].label, () => spawnPlayer(k), k === presetKey);
  button('Caja: ' + (gearbox === 'auto' ? 'automática' : 'manual'), () => { gearbox = gearbox === 'auto' ? 'manual' : 'auto'; player.physics.gearbox = gearbox; refreshBar(); });
  button('Cámara (C)', () => rig.cycle());
  button('Retrovisor (M)', () => { rig.mirror = !rig.mirror; refreshBar(); }, rig.mirror);
  button('+3 bots', addBots);
  button('Reiniciar (R)', () => respawn(player));
  button('Piloto con teclado', () => { if (keyPilot) { keyPilot.release(); keyPilot = null; } else keyPilot = makeKeyPilot(window, player.physics); refreshBar(); }, !!keyPilot);
  button('Pruebas automáticas', () => {
    res.style.display = 'block'; res.textContent = 'Corriendo pruebas…';
    setTimeout(() => { const r = runAll(); res.textContent = JSON.stringify(r, null, 1); console.log('PRUEBAS', r); }, 30);
  });
}
spawnPlayer('jdm');

// ---------------------------------------------------------------- bucle
const hud = document.getElementById('hud'), spdEl = document.getElementById('spd'), gearEl = document.getElementById('gear');
let last = performance.now(), clock = 0, fpsAcc = 0, fpsN = 0, fps = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }

  if (keyPilot && player.surface) keyPilot.tick(dt, player.surface);
  input.update(dt);
  const st = input.state;
  if (st.camera) rig.cycle();
  if (st.mirror) { rig.mirror = !rig.mirror; refreshBar(); }
  if (st.reset) respawn(player);

  const others = cars.map(c => ({ position: c.physics.position, speed: c.physics.speed }));
  for (const car of cars) {
    if (!car.surface) car.surface = track.query(car.physics.position);
    let c;
    if (car.isBot) {
      c = car.ai.controls(dt, car.surface, others);
      if (car.ai.needsReset) respawn(car);
    } else c = st;
    car.physics.step(dt, c, car.surface, 1);
    car.surface = track.query(car.physics.position, car.surface.index);
    const d = car.surface.distance;
    if (car.lastDist != null && car.lastDist > track.length - 40 && d < 40) {
      if (car.lapStart != null) { car.lastLap = clock - car.lapStart; car.bestLap = Math.min(car.bestLap ?? Infinity, car.lastLap); car.lap++; }
      car.lapStart = clock;
    }
    car.lastDist = d;
    car.physics.applyTo(car.model.group);
    car.model.update(dt, car.physics);
  }
  stats.update(player.physics, dt, clock);
  rig.update(dt, { lookBack: st.lookBack });
  rig.render(renderer, scene);

  const p = player.physics;
  spdEl.textContent = Math.round(Math.abs(p.speed) * 3.6);
  gearEl.textContent = p.gear === -1 ? 'R' : p.gear === 0 ? 'N' : p.gear;
  const f = (v, n = 1) => (v == null ? '--' : v.toFixed(n));
  const lapNow = player.lapStart != null ? clock - player.lapStart : null;
  hud.textContent =
    `${PRESETS[presetKey].label}  ·  ${fps} fps\n` +
    `Velocidad ${f(p.speed * 3.6, 0)} km/h  (máx ${f(stats.vmax, 0)}, est. ${f(p.topSpeed * 3.6, 0)})\n` +
    `Marcha ${p.gear === -1 ? 'R' : p.gear === 0 ? 'N' : p.gear} (${p.gearbox})  rpm ${f(p.rpm, 0)} / ${p.spec.redlineRpm}${p.shifting ? '  cambiando' : ''}\n` +
    `Derrape ${f(p.slipAngle * 57.3, 1)}°${p.drifting ? '  DERRAPANDO' : ''}  patina ${f(p.wheelSpin, 2)}\n` +
    `Acel. ${f(p.accelLong / 9.81, 2)} g  lateral ${f(p.accelLat / 9.81, 2)} g\n` +
    `Volante ${f(p.steerAngle * 57.3, 1)}° (lím ${f(p.steerLimit * 57.3, 1)}°)  piso ${p.surface}\n` +
    `Nitro ${f(p.nitro * 100, 0)}%${p.nitroActive ? ' ACTIVO' : ''}  muro ${f(p.wallHit, 2)}\n` +
    `0-100: ${f(stats.t100, 2)} s   vuelta ${f(lapNow, 2)}  última ${f(player.lastLap, 2)}  mejor ${f(player.bestLap, 2)}\n` +
    `Cámara ${['cabina', 'cofre', 'cerca', 'lejos'][rig.mode]}  bots ${cars.length - 1}` +
    (cars.length > 1 ? '\n' + cars.filter(c => c.isBot).map((c, i) => `  bot${i + 1} ${PRESETS[c.presetKey].label.split(' ')[0]}: v${c.lap} mejor ${f(c.bestLap, 2)} reinicios ${c.resets}`).join('\n') : '');
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); rig.resize(innerWidth, innerHeight); });
requestAnimationFrame(loop);
</script>
</body>
